name: CI Pipeline Experiment

on:
  push:
    branches: [master, main]
    paths:
      - "ci-experiment/**"
      - ".github/workflows/**"
  pull_request:
    branches: [master, main]
    paths:
      - "ci-experiment/**"
      - ".github/workflows/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci-experiment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record workflow start
        run: echo "WORKFLOW_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check src tests

      - name: Record job metrics
        run: python scripts/record_job_metrics.py Lint
        env:
          WORKFLOW_START: ${{ env.WORKFLOW_START }}

      - name: Upload lint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lint-artifacts
          path: |
            ci-experiment/artifacts/job-lint.json
            ci-experiment/artifacts/workflow-start.txt
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci-experiment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --json-report --json-report-file=artifacts/pytest-report.json
        continue-on-error: true
        id: pytest

      - name: Record job metrics
        if: always()
        run: python scripts/record_job_metrics.py Test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            ci-experiment/artifacts/pytest-report.json
            ci-experiment/artifacts/job-test.json
          retention-days: 30

      - name: Fail if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  collect-metrics:
    name: Collect Metrics
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download lint artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lint-artifacts
          path: ci-experiment/artifacts

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-artifacts
          path: ci-experiment/artifacts

      - name: Resolve workflow status
        run: |
          if [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]; then
            echo "WORKFLOW_STATUS=success" >> $GITHUB_ENV
          else
            echo "WORKFLOW_STATUS=failure" >> $GITHUB_ENV
          fi

      - name: Get commit message
        run: echo "COMMIT_MESSAGE=$(git log -1 --format=%s)" >> $GITHUB_ENV

      - name: Get experiment variation
        working-directory: ci-experiment
        run: echo "EXPERIMENT_VARIATION=$(PYTHONPATH=. python -c 'from src.experiment import VARIATION; print(VARIATION)')" >> $GITHUB_ENV

      - name: Merge pipeline metrics
        working-directory: ci-experiment
        run: python scripts/merge_pipeline_metrics.py
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}
          WORKFLOW_STATUS: ${{ env.WORKFLOW_STATUS }}
          EXPERIMENT_VARIATION: ${{ env.EXPERIMENT_VARIATION }}

      - name: Upload pipeline results
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            ci-experiment/merged/pipeline-metrics.json
            ci-experiment/merged/pipeline-metrics.csv
            ci-experiment/merged/summary.txt
            ci-experiment/artifacts/pytest-report.json
          retention-days: 30
